name: Build and Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create release for (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Decode Keystore
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: |
          echo "$KEY_STORE" | base64 -d > android/app/keystore.jks
        shell: bash

      - name: Create keystore properties file
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          {
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=keystore.jks"
          } > android/key.properties
        shell: bash

      - name: Get dependencies
        run: flutter pub get

      - name: Build universal APK
        run: flutter build apk --release

      - name: Save universal APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/omidvpn-universal.apk
        shell: bash

      - name: Build split APKs
        run: flutter build apk --split-per-abi --release

      - name: Rename split APKs
        run: |
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/omidvpn-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/omidvpn-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/omidvpn-x86_64.apk
          ls -la release
        shell: bash

      - name: Get tag name
        id: get_tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "TAG_NAME=$INPUT_TAG" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            release/omidvpn-universal.apk
            release/omidvpn-armeabi-v7a.apk
            release/omidvpn-arm64-v8a.apk
            release/omidvpn-x86_64.apk
          body: |
            ## Installation

            ### Download

            | Architecture | Download Link |
            |-------------|---------------|
            | Universal   | <a href="https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/omidvpn-universal.apk"><img src="https://img.shields.io/badge/Android-Universal-3DDC84?style=for-the-badge&logo=android&logoColor=white" alt="Android Universal"></a> |
            | armeabi-v7a | <a href="https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/omidvpn-armeabi-v7a.apk"><img src="https://img.shields.io/badge/Android-armeabi--v7a-3DDC84?style=for-the-badge&logo=android&logoColor=white" alt="Android armeabi-v7a"></a> |
            | arm64-v8a   | <a href="https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/omidvpn-arm64-v8a.apk"><img src="https://img.shields.io/badge/Android-arm64--v8a-3DDC84?style=for-the-badge&logo=android&logoColor=white" alt="Android arm64-v8a"></a> |
            | x86_64      | <a href="https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/omidvpn-x86_64.apk"><img src="https://img.shields.io/badge/Android-x86_64-3DDC84?style=for-the-badge&logo=android&logoColor=white" alt="Android x86_64"></a> |