name: Build and Release APKs

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Read version from pubspec.yaml
        run: |
          VER=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1 | tr -d '\r ')
          if [[ -z "$VER" ]]; then
            echo "Could not read version from pubspec.yaml"
            exit 1
          fi
          echo "TAG_NAME=v$VER" >> "$GITHUB_ENV"
          echo "Using tag: v$VER"

      - name: Decode Keystore
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: echo "$KEY_STORE" | base64 -d > android/app/keystore.jks

      - name: Create key.properties
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          {
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=keystore.jks"
          } > android/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build universal APK
        run: |
          flutter build apk --release
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/omidvpn-universal.apk

      - name: Build split APKs
        run: |
          flutter build apk --split-per-abi --release
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/omidvpn-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/omidvpn-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/omidvpn-x86_64.apk
          ls -la release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ env.TAG_NAME }}
          files: |
            release/omidvpn-universal.apk
            release/omidvpn-armeabi-v7a.apk
            release/omidvpn-arm64-v8a.apk
            release/omidvpn-x86_64.apk
          body: |
            ### Download

            | Architecture | Download Link |
            |-------------|---------------|
            | Universal   | <a href="https://github.com/frank-vpl/OmidVPN/releases/download/${{ env.TAG_NAME }}/omidvpn-universal.apk"><img src="https://img.shields.io/badge/Android-Universal-3DDC84?style=for-the-badge&logo=android&logoColor=white" alt="Android Universal"></a> |
            | armeabi-v7a | <a href="https://github.com/frank-vpl/OmidVPN/releases/download/${{ env.TAG_NAME }}/omidvpn-armeabi-v7a.apk"><img src="https://img.shields.io/badge/Android-armeabi--v7a-3DDC84?style=for-the-badge&logo=android&logoColor=white" alt="Android armeabi-v7a"></a> |
            | arm64-v8a   | <a href="https://github.com/frank-vpl/OmidVPN/releases/download/${{ env.TAG_NAME }}/omidvpn-arm64-v8a.apk"><img src="https://img.shields.io/badge/Android-arm64--v8a-3DDC84?style=for-the-badge&logo=android&logoColor=white" alt="Android arm64-v8a"></a> |
            | x86_64      | <a href="https://github.com/frank-vpl/OmidVPN/releases/download/${{ env.TAG_NAME }}/omidvpn-x86_64.apk"><img src="https://img.shields.io/badge/Android-x86_64-3DDC84?style=for-the-badge&logo=android&logoColor=white" alt="Android x86_64"></a> |